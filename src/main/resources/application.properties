spring.application.name=testing-learning

# --- Kafka (order events, see docs/testing-strategy.md #6) ---------------
# Spring Boot 4 defaults to Jackson 3 (tools.jackson.*, see spring-boot-starter-jackson) rather
# than Jackson 2 (com.fasterxml.jackson.databind) - there's no Jackson 2 ObjectMapper on the
# classpath here, so this project uses spring-kafka 4's Jackson-3-native
# JacksonJsonSerializer/JacksonJsonDeserializer, not the older JsonSerializer/JsonDeserializer
# pair (those still assume Jackson 2 and would fail to load).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Keep produced payloads plain JSON (no Spring-proprietary __TypeId__ header) - a real external
# consumer (or, symmetrically, the payment-confirmations producer below) wouldn't know Spring Kafka's
# type-header convention.
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the real (Jackson) deserializer so a message that fails to
# deserialize becomes a listener-thrown exception instead of killing the consumer thread - that
# exception is what the DefaultErrorHandler bean (KafkaErrorHandlingConfig) recognizes as
# non-retryable and routes straight to the dead-letter topic.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.testinglearning.order
# The payment-confirmations producer is a different (external) system - it won't send Spring's
# __TypeId__ header, so tell JacksonJsonDeserializer the target type explicitly instead of relying
# on it.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.testinglearning.order.PaymentConfirmedEvent

# --- Outbound shipping carrier (see docs/testing-strategy.md #7) ----------
shipping.client.base-url=http://localhost:8089
shipping.client.connect-timeout=1s
shipping.client.read-timeout=2s

# Retry: only ShippingUnavailableException is retryable. A ShipmentRejectedException (the carrier
# said "no") and CallNotPermittedException (the circuit is open) both go straight through.
resilience4j.retry.instances.shipping.max-attempts=3
resilience4j.retry.instances.shipping.wait-duration=200ms
resilience4j.retry.instances.shipping.retry-exceptions=com.example.testinglearning.order.ShippingUnavailableException

# CircuitBreaker: opens once at least half of the last 10 calls failed (with a minimum of 5 calls),
# then waits 30s before letting 2 trial calls through. A rejected shipment is the carrier working
# correctly, so it's ignored rather than counted as a failure.
resilience4j.circuitbreaker.instances.shipping.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.shipping.sliding-window-size=10
resilience4j.circuitbreaker.instances.shipping.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.shipping.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.shipping.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.shipping.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.shipping.record-exceptions=com.example.testinglearning.order.ShippingUnavailableException
resilience4j.circuitbreaker.instances.shipping.ignore-exceptions=com.example.testinglearning.order.ShipmentRejectedException
